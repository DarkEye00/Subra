# One droplet (4 GB RAM minimum: LibreOffice is memory-hungry).
# Usage: cp .env.example .env, fill it in, then: docker compose up -d --build
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://subra:${POSTGRES_PASSWORD}@postgres:5432/subra
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media  # only used when Spaces isn't configured
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn subra.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose: ["8000"]

  worker:
    <<: *app
    # two decks at a time; recycle workers to cap LibreOffice memory growth
    command: celery -A subra worker --loglevel info --concurrency 2 --max-tasks-per-child 20
    mem_limit: 2500m

  beat:
    <<: *app
    command: celery -A subra beat --loglevel info --schedule /tmp/celerybeat-schedule

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subra
      POSTGRES_USER: subra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subra -d subra"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
