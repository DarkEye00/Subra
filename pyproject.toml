[project]
name = "subra"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "billing/tests", "orders/tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "subra.test_settings"
addopts = "-q"
markers = [
    "slow: needs LibreOffice or other external binaries",
]
